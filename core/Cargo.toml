[package]
name = "last1-panel-core"
description = "Réglages GPU et écran de Last1 Panel, sans interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "last1_panel_core"

# Outil en ligne de commande : réglages réappliqués à la connexion
# (`last1-panel-cli apply`) et lanceur des jeux (`last1-panel-cli run %command%`).
# Sans GTK ni WebKit : un jeu se lance même si la fenêtre ne peut pas s'ouvrir.
[[bin]]
name = "last1-panel-cli"
path = "src/bin/cli.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
# Profils ICC (courbes de calibration VCGT) : la bibliothèque de couleur que
# KWin et Hyprland utilisent eux-mêmes pour les lire.
lcms2 = "6.2"
# Mise à jour de l'AppImage : liste signée par last1.fun (Ed25519, jetons en
# base64url) et empreinte SHA-256 du fichier téléchargé.
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
# Icône près de l'horloge (StatusNotifierItem, en Rust, sans GTK) et son
# image de secours si le thème d'icônes n'a pas la nôtre.
ksni = { version = "0.3", features = ["blocking"] }
png = "0.18"

[dev-dependencies]
tempfile = "3"
