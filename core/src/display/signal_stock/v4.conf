# Bureau « Signal » de go-to-linux (Hyprland). Palette : docs/DA.md.
#   fond #0A0C10 · surface #12151B · contour #262B35 · texte #ECEFF4
#   Pulse #9B8CFF (focus, information) · Volt #C5F82A (actif, rare)
# Raccourcis repris de Windows ; liste complète : Super + F1.
# Ce fichier est le vôtre : modifiez-le, il n'est jamais remplacé.

# Écrans : réglés à chaque connexion (définition native, fréquence maximale)
# tant que monitors.conf garde la ligne « # gtl:auto » ; nwg-displays le remplace.
monitor = , preferred, auto, auto
source = ~/.config/hypr/monitors.conf
# Clavier, Verr. Num et carte graphique de ce PC (écrit par go-to-linux).
source = ~/.config/hypr/gtl-machine.conf

$gtl = /usr/local/lib/gtl/desktop
$terminal = alacritty
$files = dolphin

env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,kde
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE QT_QPA_PLATFORMTHEME
exec-once = hyprctl setcursor breeze_cursors 24
exec-once = $gtl/gtl-ecrans
exec-once = swaybg -m fill -c 0a0c10 -i /usr/local/share/gtl/desktop/signal.png
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = $gtl/gtl-premiere-fois

general {
    gaps_in = 4
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(9b8cff)
    col.inactive_border = rgb(262b35)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

# Mouvements courts et doux (150 ms), sans rebond.
animations {
    enabled = true
    bezier = signal, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 1.5, signal, popin 96%
    animation = windowsOut, 1, 1.5, signal, popin 96%
    animation = border, 1, 1.5, signal
    animation = fade, 1, 1.5, signal
    animation = layers, 1, 1.5, signal, fade
    animation = workspaces, 1, 2, signal, slidefade 8%
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(0a0c10)
    # Fréquence variable (FreeSync, G-Sync) en plein écran seulement : jeux.
    vrr = 2
    middle_click_paste = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

input {
    follow_mouse = 1
    touchpad {
        tap-to-click = true
        natural_scroll = false
    }
}

# --- Raccourcis --------------------------------------------------------------

# Touche Windows seule : applications (comme le menu Démarrer).
bindr = SUPER, SUPER_L, exec, pkill -x fuzzel || fuzzel
bind = SUPER, S, exec, pkill -x fuzzel || fuzzel
bind = SUPER, R, exec, pkill -x fuzzel || fuzzel

bind = SUPER, Return, exec, $terminal
bind = SUPER, E, exec, $files
bind = SUPER, I, exec, systemsettings
bind = SUPER, L, exec, loginctl lock-session
bind = SUPER, V, exec, $gtl/gtl-presse-papiers
bind = SUPER, N, exec, makoctl restore
bind = SUPER SHIFT, N, exec, makoctl dismiss --all
bind = SUPER, X, exec, $gtl/gtl-alimentation
bind = CTRL ALT, Delete, exec, $gtl/gtl-alimentation
bind = CTRL SHIFT, Escape, exec, $terminal --class gtl-btop -e btop
bind = SUPER, F1, exec, $gtl/gtl-raccourcis
# Capture : glisser pour une zone, cliquer sur une fenêtre ou sur l'écran.
bind = , Print, exec, $gtl/gtl-capture
bind = SUPER SHIFT, S, exec, $gtl/gtl-capture

# Fenêtres.
bind = ALT, F4, killactive,
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen, 0
bind = SUPER, Up, fullscreen, 1
bind = SUPER, Down, togglefloating,
bind = SUPER, Left, movewindow, l
bind = SUPER, Right, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Bureaux (comme les bureaux virtuels de Windows : Ctrl + Windows + flèches).
bind = SUPER CTRL, Left, workspace, r-1
bind = SUPER CTRL, Right, workspace, r+1
bind = SUPER CTRL, D, workspace, empty
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Son, luminosité et lecture.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Fenêtres particulières ----------------------------------------------------

# Réglages et petites fenêtres : flottantes, au centre.
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|nwg-displays|gtl-btop)$
windowrule = size 960 640, match:class ^(gtl-btop)$
windowrule = center on, match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|nwg-displays|gtl-btop)$
windowrule = float on, match:class ^(org.qt-project.qml6?|qml6?)$
windowrule = center on, match:class ^(org.qt-project.qml6?|qml6?)$
windowrule = float on, match:title ^(Liste d'amis|Friends List|Steam - News|Steam Settings|Paramètres Steam)$
# Écran jamais éteint ni verrouillé pendant un jeu ou une vidéo en plein écran.
windowrule = idle_inhibit fullscreen, match:class .*
