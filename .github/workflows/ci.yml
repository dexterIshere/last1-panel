# Tests à chaque push. Sur main, publiés ensemble sur last1.fun, comme
# SoundFence : l'AppImage (téléchargée depuis la page, elle s'installe à sa
# première ouverture) et le paquet Arch (installé et tenu à jour d'office par
# go-to-linux sous CachyOS).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Relance à la main, par exemple une fois le site déployé avec Last1 Panel.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèques de Tauri et lcms2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev liblcms2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Interface (svelte-check, compilation)
        run: bun run check && bun run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # AppImage construite dans Debian 12 (packaging/appimage), comme celle de
  # SoundFence : elle tourne sur tous les systèmes plus récents.
  appimage:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version (celle de Cargo.toml, et le numéro de la construction)
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1).r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: AppImage
        run: |
          docker build --quiet --tag last1-panel-appimage packaging/appimage
          mkdir -p dist
          docker run --rm --env VERSION='${{ steps.version.outputs.value }}' \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            --volume "$PWD:/src:ro" --volume "$PWD/dist:/out" last1-panel-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: last1-panel-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # Paquet Arch construit dans un conteneur Arch, puis publié avec l'AppImage
  # sur last1.fun (jeton OIDC de GitHub : le site vérifie qu'il vient de ce
  # dépôt, sur main ; aucun secret).
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, appimage]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      SITE_URL: https://last1.fun
    steps:
      - name: Outils de construction
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust bun webkit2gtk-4.1 gtk3 lcms2 lact jq curl
          useradd -m builder
      - uses: actions/checkout@v4
      - id: version
        name: Version (celle de Cargo.toml, et le numéro de la construction)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1).r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Paquet
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder packaging/arch/build.sh '${{ steps.version.outputs.value }}' /home/builder/out
      - uses: actions/upload-artifact@v4
        with:
          name: last1-panel-${{ steps.version.outputs.value }}
          path: /home/builder/out/*.pkg.tar.zst
      - uses: actions/download-artifact@v4
        with:
          name: last1-panel-appimage
          path: /home/builder/appimage
      - name: Publication sur last1.fun
        run: |
          # Site pas encore déployé avec Last1 Panel dans son catalogue : rien à
          # publier (relancez la CI à la main une fois le site à jour).
          if ! curl -fsS --max-time 20 "${SITE_URL%/}/api/config" | grep -q '"slug":"last1-panel"'; then
            echo "::warning::last1-panel n'est pas dans le catalogue de $SITE_URL : paquet non publié."
            exit 0
          fi
          packages=(/home/builder/out/last1-panel-*.pkg.tar.zst)
          appimages=(/home/builder/appimage/Last1Panel_*_amd64.AppImage)
          # L'AppImage d'abord : c'est le téléchargement proposé aux joueurs.
          tools/publish-release.sh last1-panel '${{ steps.version.outputs.value }}' \
            "download:${appimages[0]}" "download:${packages[0]}"
