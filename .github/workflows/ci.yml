# Tests à chaque push ; paquet Arch joint à la version GitHub pour chaque tag vX.Y.Z.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèques de Tauri et lcms2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev liblcms2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Interface (svelte-check, compilation)
        run: bun run check && bun run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container: archlinux:latest
    steps:
      - name: Outils de construction
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust bun webkit2gtk-4.1 gtk3 lcms2
          useradd -m builder
      - uses: actions/checkout@v4
      - name: makepkg (sources du tag)
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp packaging/arch/PKGBUILD /home/builder/
          sed -i "s/^pkgver=.*/pkgver=$version/" /home/builder/PKGBUILD
          chown -R builder /home/builder
          cd /home/builder && sudo -u builder makepkg --noconfirm
      - uses: softprops/action-gh-release@v2
        with:
          files: /home/builder/*.pkg.tar.zst
