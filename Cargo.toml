[workspace]
# core : toute la logique, sans GTK ni WebKit (testable partout, et l'outil
# des jeux en dépend seul). src-tauri : la fenêtre.
members = ["core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/dexterIshere/last1-panel"
authors = ["Last1"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
